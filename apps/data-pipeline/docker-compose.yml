x-airflow-common: &airflow-common
  build: .
  env_file: .env
  environment: &airflow-common-env
    PYTHONPATH: /opt/airflow
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_POSTGRES_USER}:${AIRFLOW_POSTGRES_PASSWORD}@airflow-postgres/${AIRFLOW_POSTGRES_DB}
    AIRFLOW__CORE__FERNET_KEY: ${FERNET_KEY}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW_CONN_POSTGRES_CONN: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
    - ./src:/opt/airflow/src # 기존 작업된 파이썬 로직 마운트
    - ./configs:/opt/airflow/configs # 기존 작업된 YAML 설정 마운트
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    airflow-postgres:
      condition: service_healthy
    minio:
      condition: service_healthy
    postgres:
      condition: service_healthy

services:
  # 1. 메인 오브젝트 스토리지 (MinIO - S3 Lakehouse)
  minio:
    image: minio/minio:latest
    container_name: local_s3_storage
    restart: unless-stopped
    ports:
      - "9000:9000" # S3 API 엔드포인트
      - "9001:9001" # Web UI 콘솔 포트
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
    volumes:
      - ./minio_data:/data # 호스트 디스크에 실제 파일 영속화 (RAM 소모 0)
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 3s
      timeout: 3s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: local_s3_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 ${AWS_ACCESS_KEY_ID:-minioadmin} ${AWS_SECRET_ACCESS_KEY:-minioadmin};
      /usr/bin/mc mb myminio/data-pipeline-bronze --ignore-existing;
      /usr/bin/mc mb myminio/data-pipeline-silver --ignore-existing;
      /usr/bin/mc mb myminio/data-pipeline-gold --ignore-existing;
      echo 'S3 Bronze/Silver/Gold Buckets Initialization Completed!';
      exit 0;
      "

  # 1. Metadata DB
  airflow-postgres:
    image: postgres:16
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: ${AIRFLOW_POSTGRES_USER}
      POSTGRES_PASSWORD: ${AIRFLOW_POSTGRES_PASSWORD}
      POSTGRES_DB: ${AIRFLOW_POSTGRES_DB}
    volumes:
      - airflow-db-volume:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD",
          "pg_isready",
          "-U",
          "${AIRFLOW_POSTGRES_USER}",
          "-d",
          "${AIRFLOW_POSTGRES_DB}",
        ]
      interval: 5s
      retries: 5
    restart: always

  # 3. Airflow Webserver
  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    restart: always
    environment:
      <<: *airflow-common-env
      AIRFLOW__WEBSERVER__SHOW_TRIGGER_FORM_IF_NO_PARAMS: "True"
    depends_on:
      airflow-postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      # Rationale: DB 초기화 스크립트가 완벽히 종료된 후에만 웹서버를 기동하여 Race Condition 원천 차단
      airflow-init:
        condition: service_completed_successfully

  # 4. Airflow Scheduler (LocalExecutor에서는 작업 실행 병행)
  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    restart: always
    depends_on:
      airflow-postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      # Rationale: 동일하게 초기화 완료 후 스케줄러 기동
      airflow-init:
        condition: service_completed_successfully

  # 5. Initialization (1회성 실행)
  airflow-init:
    <<: *airflow-common
    # Rationale: 외부 .sh 파일을 사용하지 않고, Compose 단계에서 직접 Bash 명령어를 주입하여 파일 파싱/권한 에러(Exit 2, 4) 원천 차단
    command:
      - bash
      - -c
      - |
        echo "Starting Airflow Initialization..."
        airflow db migrate
        airflow users create \
          --username "${_AIRFLOW_WWW_USER_USERNAME:-admin}" \
          --firstname "Admin" \
          --lastname "User" \
          --role Admin \
          --email "${_AIRFLOW_WWW_USER_EMAIL:-admin@example.com}" \
          --password "${_AIRFLOW_WWW_USER_PASSWORD:-admin}" || true
        echo "Creating Airflow Pools..."
        airflow pools set external_api_pool 1 "Pool for External API Throttling" || true
        echo "Airflow Initialization Completed Successfully."
    depends_on:
      airflow-postgres:
        condition: service_healthy

  # 3. 통합 데이터 저장소
  postgres:
    image: postgres:16
    ports:
      - "5433:5432" # 외부 클라이언트 접속용 포트 (5433)
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}"]
      interval: 5s
      retries: 5
    restart: always

volumes:
  airflow-db-volume: # Airflow 메타데이터용 볼륨
  postgres-db-volume: # 통합 데이터 저장소용 볼륨
